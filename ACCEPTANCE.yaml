    quadrant: "Q3"
    check: "human"
    record: "acceptance/records/latency-probe-and-eviction.md"
    negative: "latency_test_url 指向上游域名(拿上游当测速靶),或节点熔断后 sticky 账号仍被钉在死节点上,任一即判不通过"
