project:
  name: "mirasim-on-sub2api"
  determinism: "deterministic"
  commit_sha: "789d809c09f81ba14b550f444c05e7be4e288791"
  review_period_days: 30
  last_red_at: "2026-09-16"
  retain_failure_observables: true
  external_boundaries:
    - "mirasim upstream (signed wire protocol)"
    - "Anthropic prompt cache (linear prefix match)"
    - "Redis (sticky session pins)"
    - "PostgreSQL (account state)"

toolchain:
  language: "go"
  # 跑法:`cd backend && go test -tags unit ./internal/...`。
  # 这不是可选项 —— 本义务集里 SC / QU / RG / QW 四组的判据住在带 `//go:build unit`
  # 的文件里(mirasim_quota_test.go、mirasim_statuscode_test.go、
  # mirasim_window_evidence_test.go、claude_code_detection_test.go)。
  # 判决器按源码文本找 [[cov:]] 标签,找得到就算填实;而不带 -tags unit 的
  # `go test ./...` 根本不编译这些文件。两者的差在机检上看不出来,
  # 所以把命令写在这里:漏了 tag 的那次「全绿」,绿的是一个更小的集合。
  # 只收本次移植真正新增/触及的测试,不把 sub2api 既有的上千个测试卷进来
  test_glob:
    - "backend/internal/pkg/mirasim/**/*_test.go"
    - "backend/internal/pkg/tlsfingerprint/*_test.go"
    - "backend/internal/repository/mirasim_*_test.go"
    - "backend/internal/service/mirasim_*_test.go"
    - "backend/internal/handler/admin/account_mirasim_*_test.go"
    # 计划探测的测试落在 service/account_mirasim_plan_probe_test.go —— 前缀是 account_,
    # 上面那条 mirasim_*_test.go 够不着它。不加这一行,已经下沉的三个 [[cov:PL:*]] 标签
    # 会因为「扫描器看不见那个文件」而被判成空白领土 —— 那是仪器盲区,不是真实缺口。
    - "backend/internal/service/account_mirasim_*_test.go"
    # 「仅 CC」校验不是本次移植新写的,但 CC 那两条义务的判据就住在这里。
    # 收进来是为了让 [[cov:CC:*]] 标签有地方下沉;收进来之后有没有标签,由判决器说了算。
    - "backend/internal/service/claude_code_*_test.go"
  # SUT 收窄到 mirasim 路径实际被测的文件。
  # 不用 backend/internal/**/*.go 的原因不是为了放宽判据,而是相反:
  # 全量扫描会把 openai_first_output_timeout.go:322 的方法名 close 收进 SUT 符号集,
  # 与 go 内建名 close 撞名 —— 那样断言里写一行 close(...) 就算"碰到了被测对象",
  # TG-3 非平凡断言判据当场失效。
  sut_glob:
    - "backend/internal/pkg/mirasim/**/*.go"
    - "backend/internal/pkg/tlsfingerprint/*.go"
    - "backend/internal/repository/mirasim_upstream.go"
    - "backend/internal/service/mirasim_*.go"
    - "backend/internal/service/gateway_anthropic_passthrough.go"
    - "backend/internal/service/model_rate_limit.go"
    - "backend/internal/handler/admin/account_mirasim_import.go"
    # 下面三条是随 PL / CC 两组义务一起进来的被测源码。加进 SUT 的唯一目的是让
    # 「断言里出现来自被测源码的真实符号」这条判据对它们的测试也成立 ——
    # 逐一核过:这三份文件的顶层声明里没有任何 go 内建名(len/cap/close/new/…),
    # 不会重演注释里 openai_first_output_timeout.go 那个 close 撞名的放宽。
    - "backend/internal/service/account_mirasim_plan_probe.go"
    - "backend/internal/handler/admin/account_mirasim_plan.go"
    - "backend/internal/service/claude_code_validator.go"
    # ── 下面这一批是「判红倒逼补齐」的结果，不是为了转绿而放宽 ──
    # TG-3 要求断言里至少出现一个**来自被测源码**的符号（SutIndex，按 symbol_re 抽顶层
    # func/type/var/const）。BL / CP / SC / QU 四组的测试断的都是这些文件里的东西
    #（CalculateCost / GetModelPricing / StripEmptyTextBlocks / ParseMetadataUserID /
    # IsSchedulableForModelWithContext / shouldFailoverUpstreamError / anthropicFableRateLimitKey），
    # 而它们此前一个都不在 sut_glob 里 —— 于是符号集里找不到，15 条真实断言被判成
    # 「没碰被测对象」。那是**仪器盲区**：被测对象确实被断言了，只是判决器看不见它。
    #
    # 加进来之前逐份跑过内建名反证（_c_sut_symbols 那条判据的同一口径：
    # 用 symbol_re 抽顶层符号 ∩ Go 内建名集合）：
    #   billing_service.go 77 符号 / pricing_service.go 51 / gateway_request.go 58 /
    #   metadata_userid.go 8 / ratelimit_service.go 111 / account.go 213 /
    #   gateway_upstream_response.go 37 / gateway_scheduling.go 69
    # 八份全部**零**撞名，不会重演注释里 openai_first_output_timeout.go 那个 close 的放宽。
    - "backend/internal/service/billing_service.go"
    - "backend/internal/service/pricing_service.go"
    - "backend/internal/service/gateway_request.go"
    - "backend/internal/service/metadata_userid.go"
    - "backend/internal/service/ratelimit_service.go"
    - "backend/internal/service/account.go"
    - "backend/internal/service/gateway_upstream_response.go"
    - "backend/internal/service/gateway_scheduling.go"
    # stripDeferredToolCacheControl 住在这里，CP:tools-bytewise 断的就是它。
    # 内建名反证：17 个顶层符号，零撞名。
    - "backend/internal/service/gateway_tool_rewrite.go"
  # 追加非平凡断言模式。**不是**把判据改松，是补语言预设漏掉的 testify 动词。
  #
  # Go 预设的 nontrivial_re 只列了 Equal/NotEqual/EqualValues/JSONEq/Contains/
  # ErrorIs/ErrorContains/InDelta 八个，且都不带 `f` 后缀。于是
  #   require.InEpsilonf(t, 期望值, 实际值, eps, "...")
  #   require.Greaterf(t, 写入费用, 输入费用, "...")
  #   require.Less(t, 相似度, 阈值)
  # 这些**确确实实在比值**的断言落进了「未分类」，整条测试被判成「没有非平凡断言」。
  # 那是预设的覆盖缺口，不是这些测试不够硬。
  #
  # 加的全部是**对着一个期望值做比较**的动词。刻意不加的：
  #   True / False / Nil / NotNil / Empty / NotEmpty / NoError
  # 它们只断言一个谓词或存在性，没有期望值可比 —— 预设把它们判平凡是对的，
  # 本项目里几条只有这类断言的测试应当去补断言，而不是在这里把它们抬上来。
  # （抬上来一次，就等于把「跑通不崩」重新命名成「非平凡」。）
  #
  # 反证：RELAX_REGISTRY 给 assertion_extra 挂的是 preset_canary —— 判决时会拿 Go 预设
  # 自带的一对标定样本重跑，非平凡样本仍判非平凡、平凡样本仍判平凡。下面这些模式
  # 都要求括号里至少两个实参，`[".*"]` 那种整份放宽过不了这一关。
  assertion_extra:
    # 预设那八个动词的 `f` 后缀变体（testify 的格式化版，语义完全相同）
    - "\\b(require|assert)\\.(Equal|NotEqual|EqualValues|JSONEq|Contains|ErrorIs|ErrorContains|InDelta)f\\s*\\(\\s*\\S+\\s*,\\s*\\S"
    # 预设漏掉的比较类动词（含 f 变体）
    - "\\b(require|assert)\\.(InEpsilon|Less|LessOrEqual|Greater|GreaterOrEqual|Len|NotContains|Subset|ElementsMatch)f?\\s*\\(\\s*\\S+\\s*,\\s*\\S"
  # 平凡断言判据：预设的**超集**，多认一种形态，不减一种。
  #
  # 为什么必须在这里写：Go 预设自带的那对标定样本里，"平凡"那一条是
  #     if err := compute(2); err != nil { t.Fatal(err) }
  # 而预设的 trivial_re 只写了 `if err != nil {` 这一种形态，认不出带初始化语句的
  # `if err := …; err != nil`。于是那条样本落进「未分类」而不是「平凡」，
  # preset_canary 反证判 FAIL（nt=0 tv=0）。实测确认这与本项目加的 assertion_extra
  # 无关：纯预设下同样是 nt=0 tv=0 —— 是预设自己的覆盖缺口，只是平时没有放宽字段
  # 去触发那条反证，所以一直没被照出来。
  #
  # 补的这一条让判据**更严**而不是更松：它把一种本来逃进「未分类」的
  # 「跑通不崩」形态明确判成平凡。方向与 assertion_extra 相反，两条一起构成
  # 一次完整的双侧调整：该算比较的算比较，该算不崩的算不崩。
  trivial_re:
    - "\\bif\\s+err\\s*!=\\s*nil\\s*\\{\\s*t\\.(Fatal|Error)"
    - "\\b(require|assert)\\.(NoError|NotNil|True|False)\\s*\\("
    # 预设漏掉的：带初始化语句的 err 检查
    - "\\bif\\s+\\w+\\s*:=[^;\\n]*;\\s*\\w+\\s*!=\\s*nil\\s*\\{\\s*t\\.(Fatal|Error)"
  mutation:
    tool: "manual-injection"
    # 2026-09-17：机器生成的验收产物（calibration/ 与 adequacy/ 两个目录、
    # obligations.generated.json）已从仓库删除，只保留本文件与 acceptance/records/
    # 的人工签字。原因是它们内部不自洽：哈希链的锚 calibration/RUNS-LEDGER 被 git
    # 跟踪，而它锚的链体 calibration/runs.jsonl 没有 —— 干净检出会被判成「流水被删」。
    # 下面这个路径因此指向一个当前不存在的文件；跑 acceptance-lint 会重新生成它。
    # 删除前的整套内容备份在仓库外：
    #   ~/.local/src/sub2api-acceptance-artifacts-20260917.tgz
    report: "adequacy/injections.json"

# ── S4 双侧标定的三项事先声明 ──────────────────────────────────────────────
#
# 这三项是 `evidence: executed` 的锚②③④：判决器会核 calibration.json 里的
# executed_by / command 与这里**逐字**相符、且每条阳性的 case 名能在 spec 原文里
# 找到；对不上就降级按 declared 判读并写进未机检项。所以它们必须**事先**在这里
# 声明，不能由报表事后自填。
#
# executor 用判决器自带的执行器：本仓是确定性档,注入就是「改一处源码字节」,
# 不需要项目自带跑批器。它会亲自改文件 → 校验真改动(改前==改后则抛「变异未生效」)
# → 跑下面这条命令 → 抓红因 → 还原。
#
# command 里的 `-tags unit` 不是可选项:SC / QU / RG / QW 四组的判据住在带
# `//go:build unit` 的文件里(见上面 toolchain 的注释)。漏了 tag 的那次「全绿」,
# 绿的是一个更小的集合 —— 而标定报表的差分阴性读的正是这条命令的基线退出码,
# 用一条编译不到判据的命令做基线,阴性会「绿得毫无鉴别力」。
#
# 这里**刻意不收窄**到某几个包:22 条门散在 5 个包里,按包收窄能省约 40 秒、
# 却会让「注入 A 包的缺陷把 B 包的测试打红」这类真实的越界失效照不出来。
calibration:
  executor: "acceptance-lint --calibrate --execute"
  command: "cd backend && go test -tags unit ./internal/... -count=1"
  # 同上：calibration/ 整个目录已于 2026-09-17 删除，这个 spec 路径当前不存在。
  spec: "calibration/injections.json"

# ── 义务集由机器从这里展开;作者只声明「有什么对象」,维度由脚本做乘法 ──
structure_sources:

  # 上游响应 → 调度动作。这一张是 mirasim 语义能否被 sub2 正确消费的全部内容。
  - kind: "fault_matrix"
    id: "SC"
    rows:
      - id: "503-capacity"
        expect: "账号保持 schedulable,不写任何冷却字段(该模型此刻无容量,账号本身健康)"
        external: "mirasim upstream"
      - id: "429-5h"
        expect: "写 5h scope 冷却;7d/7d_claude/7d_fable 三个 scope 不受影响"
        external: "mirasim upstream"
      - id: "429-7d"
        expect: "写 7d scope 冷却;5h scope 不受影响"
        external: "mirasim upstream"
      - id: "429-7d-claude"
        expect: "只锁 claude 族;同账号的 fable 请求仍可调度"
        external: "mirasim upstream"
      - id: "429-7d-fable"
        expect: "只锁 fable 族;同账号的 opus/sonnet/haiku 请求仍可调度"
        external: "mirasim upstream"
      - id: "403-banned"
        expect: "账号被禁用(运营者既定决策:403 即封号,此行为被测试固定住防止重构误改)"
        external: "mirasim upstream"
      - id: "400-badrequest"
        expect: "不污染仅 body 相同、header 不同的后续请求(缓存键必须含 header 指纹)"
        external: "mirasim upstream"
      - id: "401-expired"
        expect: "触发 token refresh 并重试;不得禁用账号"
        external: "mirasim upstream"
      - id: "402-nobalance"
        expect: "本地拦截,不发出任何上游请求"
      - id: "499-cancel"
        expect: "不重试到另一个账号(取消会丢弃 in-flight 缓存写入,重试即从零重建)"

  # 缓存前缀三段的出站字节判定。Anthropic 缓存是 tools→system→messages 的线性前缀匹配。
  - kind: "fault_matrix"
    id: "CP"
    rows:
      - id: "system-bytewise"
        expect: "出站 system 与入站逐字节相同;cache_control 断点在原位"
      - id: "tools-bytewise"
        expect: "出站 tools 与入站逐字节相同(tools 是前缀最前一段,动它整条链全废)"
      - id: "prefix-monotonic"
        expect: "同一会话第 2 轮出站的 tools+system+messages 是第 1 轮的字节前缀(prefix-of,不是相等)"
      - id: "no-key-reorder"
        expect: "出站 body 的对象 key 顺序与入站相同(map[string]any round-trip 会按字母序重排)"
      - id: "no-html-escape"
        expect: "正文中的 < > & 不被转义成 \\u003c 等"
      - id: "bigint-precision"
        expect: "工具入参中的大整数不丢精度(json.Marshal 经 float64 会把 12345678901234567890 变成 ...567000)"

  # 身份恒定:一号一设备,多客户在上游表现为同一台设备。
  - kind: "fault_matrix"
    id: "ID"
    rows:
      - id: "deviceseed-stable"
        expect: "同一账号的 DeviceSeed 跨进程重启、跨不同客户端请求保持不变"
      - id: "deviceseed-db-backed"
        expect: "清空 Redis 后 DeviceSeed 仍不变(必须来自 DB,不是缓存)"
      - id: "sessionid-stable"
        expect: "x-mirasim-session fallback 跨重启不变(否则整池同步轮换 session)"
      - id: "sessionid-distinct"
        expect: "不同账号的 SessionID 互不相同(防止被归一成同一个常量)"
      - id: "version-client-independent"
        expect: "出站 claude-cli 版本与入站客户端版本无关,恒为 canonical 值"
      - id: "version-coherent"
        expect: "UA 版本与 x-stainless-package-version / runtime-version 属于同一次实抓的自洽组合"
      - id: "mirasim-client-paired"
        expect: "x-mirasim-client 的值与实际使用的签名算法版本属于同一组合"
      - id: "tls-ja3"
        expect: "TLS ClientHello 的 JA3 == 71dc8c533dd919ae9f4963224a4ba8fd(Mirasim.app Electron),不是 sub2api 现成的 Claude Code profile"

  # 签名正确性:错一个字节 = 全量 403。
  - kind: "fault_matrix"
    id: "SG"
    rows:
      - id: "bytewise-parity"
        expect: "固定输入下,五个 x-mirasim-* 头与 ma-relay 实现逐字节相同"
      - id: "body-sensitivity"
        expect: "body 改 1 bit,签名必须变化(防止签了个与 body 无关的常量)"
      - id: "path-signed"
        expect: "构造错误 path 时上游拒绝(证明签名真在起作用)"
      - id: "query-not-signed"
        expect: "URL 追加 ?beta=true 后仍 200(sub2api 确实会加这个 query)"
      - id: "no-post-sign-mutation"
        expect: "签名后到发出为止,body sha256 与 header 快照不变"
      - id: "retry-resigns"
        expect: "失败重试路径产生全新请求并重新签名,不改写并重发已签请求"
      - id: "no-redirect"
        expect: "禁止跟随重定向(Go 跳转会换 path,必然破坏 path 签名)"

  # 四层配额窗口:即使只开 claude 族,四个计数器也全部生效。
  - kind: "fault_matrix"
    id: "QU"
    rows:
      - id: "opus-window-and"
        expect: "opus/sonnet/haiku 请求的可调度性 = 5h ∧ 7d ∧ 7d_claude 三个窗口都有余量"
      - id: "fable-window-and"
        expect: "fable 请求的可调度性 = 5h ∧ 7d ∧ 7d_fable 三个窗口都有余量"
      - id: "family-isolation"
        expect: "7d_claude 耗尽时 opus 不可调度,但同账号 fable 仍可调度"
      - id: "single-quota-state"
        expect: "同一上游实体只有一套配额状态,不出现一侧耗尽而另一侧判定健康"

  # 迁移正确性:DeviceSeed 错一字节该号即废,且表现为 403 像被封号。
  - kind: "fault_matrix"
    id: "MG"
    rows:
      - id: "per-account-signature"
        expect: "导入后对每一个账号跑签名差分,全部通过(不接受抽样)"
      - id: "idempotent"
        expect: "导入脚本重复执行结果一致,不产生重复账号"
      - id: "source-preserved"
        expect: "ma-relay 侧原始配置未被修改或删除"

  # 不回归:mirasim 特化不得改变既有渠道行为。
  - kind: "fault_matrix"
    id: "RG"
    rows:
      - id: "existing-channels-unchanged"
        expect: "现有渠道(openai/grok/gemini/bedrock/antigravity 等)的状态码冷却时长与禁用条件未被改变"

  # 计费口径:折扣算反时,缓存命中率越高亏得越多。
  - kind: "fault_matrix"
    id: "BL"
    rows:
      - id: "cache-read-discount"
        expect: "cache_read_input_tokens 按 0.1x 计价"
      - id: "cache-write-5m"
        expect: "5 分钟 TTL 的 cache_creation 按 1.25x 计价"
      - id: "cache-write-1h"
        expect: "1 小时 TTL 的 cache_creation 按 2x 计价"
      - id: "no-price-fallback"
        expect: "每个已启用模型都有显式定价条目,不 fallback 到默认价"

  # 部署与出口代理池。这一组的被测对象在机器外面(VPS + resin + 出口 IP 池),
  # 单元测试照不到它 —— 所以它们全部挂在人判通道上,而不是假装有自动化覆盖。
  - kind: "fault_matrix"
    id: "DP"
    rows:
      - id: "egress-not-cn-hk"
        expect: "出口 IP 不含中国大陆与香港"
        external: "egress proxy pool"
      - id: "egress-not-vps-itself"
        expect: "出口 IP 不等于 VPS 自身公网 IP(124.221.206.59)—— 相等即说明代理没生效,请求在裸奔"
        external: "egress proxy pool"
      - id: "leases-per-ip-max-3"
        expect: "同一出口 IP 上的账号数 ≤ 3"
        external: "egress proxy pool"
      - id: "sticky-per-account"
        expect: "同一账号连续 10 次请求的出口 IP 不变"
        external: "egress proxy pool"
      - id: "latency-probe-target"
        expect: "resin 的 latency_test_url 是轻量 204 探针(gstatic generate_204),上游域名只出现在 latency_authorities —— 不是把上游域名当测速靶"
        external: "resin gateway"
      - id: "latency-eviction"
        expect: "延迟超阈值的节点被熔断,挂在它上面的 sticky 账号自动迁走;阈值恢复后该节点重新进池"
        external: "resin gateway"
      - id: "proxy-auth-header"
        expect: "代理认证用 Proxy-Authorization 而非 Authorization(用错会拿到 407)"
        external: "egress proxy pool"
      - id: "no-domain-plain-http"
        expect: "对外是 IP:6699 明文 HTTP(腾讯云未备案,上不了域名),这个事实被显式记录下来而不是留给下一个人去撞"
        external: "deployment"

  # 凭据与合规。sub2api 是开源白盒:仓库里的默认 secret 全世界都读得到,
  # 「用了默认值」与「没有口令」在攻击者眼里是同一件事。
  - kind: "fault_matrix"
    id: "SEC"
    rows:
      - id: "no-default-secrets"
        expect: "JWT、admin 口令、DB 口令、resin token 全部是部署时随机生成的值,没有一个等于仓库默认值"
        external: "deployment"
      - id: "secrets-not-in-repo"
        expect: "任何 secret 都不出现在仓库、日志与测试输出里"
        external: "deployment"
      - id: "admin-compliance-ack"
        expect: "管理员合规确认由运营者本人完成,自动化不得代签"
        external: "operator"

  # 导入策略。这一组判的不是「导入器写得对不对」(那是 MG),而是
  # 「导入进来的是不是运营者真正愿意卖的那批号」—— 选择集本身。
  - kind: "fault_matrix"
    id: "IMP"
    rows:
      - id: "skip-disabled"
        expect: "来源里标记为 disabled 的账号不导入"
      - id: "skip-annual-reserved"
        expect: "2027 年到期的一年期账号不导入(运营者自用)"
      - id: "honor-explicit-keep"
        expect: "运营者点名要导的账号,即使命中 skip-disabled / skip-annual-reserved 也要导入"
      - id: "honor-explicit-skip"
        expect: "运营者点名不导的账号一定不导入"
      - id: "import-count-matches"
        expect: "导入数 + 保留数 == 来源总数(账目守恒:没有账号在中间悄悄蒸发)"

  # 端到端真实性。手拼的 curl body 与真客户端的形态不同(system 分段、
  # cache_control 断点、metadata.user_id、stainless 头组),拿它验收等于验了个替身。
  - kind: "fault_matrix"
    id: "E2E"
    rows:
      - id: "real-client-not-curl"
        expect: "验收用的是真实 Claude Code 客户端指向 sub2 的 URL 发起会话,不是 curl 手拼的 body"
        external: "Claude Code client"
      - id: "generated-key"
        expect: "鉴权用后台生成的 key,不是管理员 token(管理员 token 走的是另一条路径,过了不代表客户过得了)"
      - id: "real-content-and-usage"
        expect: "返回真实 content,且 usage 的 input/output token 均非零"
        external: "mirasim upstream"

  # 客户端识别:放真 Claude Code 进来、把伪造者挡在外面。
  - kind: "fault_matrix"
    id: "CC"
    rows:
      - id: "real-client-passes"
        expect: "真实 Claude Code 2.1.272 的请求通过「仅 CC」校验"
      - id: "impostor-still-fails"
        expect: "伪造者(UA 或 system prompt 对不上)仍被拒绝 —— 放真客户端进来不能顺手把门拆了"

  # 配额窗口的证据等级:认识的 window token 要落到对的 scope,
  # 不认识的必须留下可观测信号 —— 静默丢弃会让「没冷却」和「冷却没写成」长得一模一样。
  - kind: "fault_matrix"
    id: "QW"
    rows:
      - id: "known-window-tokens-map"
        expect: "5h / 7d 落账号级标量,7d_claude / 7d_fable 各落自己的 scope"
        external: "mirasim upstream"
      - id: "unknown-window-is-observable"
        expect: "上游给出不在四窗口内的 window token 时,留下可观测信号(日志/计数),不静默吞掉"
        external: "mirasim upstream"

  # 计划探测:账号自己声称的档位不是权威值,权威值要去 mirasim 那边问。
  - kind: "fault_matrix"
    id: "PL"
    rows:
      - id: "import-carries-plan"
        expect: "导入后 extra 里有 plan 与 plan_expires_at,取值与来源一致"
      - id: "probe-updates-plan"
        expect: "探测拿到权威 current_plan 后正确更新账号档位"
        external: "mirasim upstream"
      - id: "claimed-vs-authoritative"
        expect: "声称 max 而权威 plus 时,两个值都保留且冲突被标记,不静默覆盖成其中一个"
        external: "mirasim upstream"
      - id: "probe-uses-account-proxy"
        expect: "探测请求走该账号自己的代理(否则探测本身就是一次裸奔,还会把出口 IP 和账号解绑)"
        external: "egress proxy pool"
      - id: "malformed-referral-is-safe"
        expect: "响应结构不符时不写入、不污染已有值(保留上一次的好读数)"
        external: "mirasim upstream"

goals:
  - id: "G1"
    statement: "签名、请求头那些是匹配的"
    observable: "运维在对 mirasim 发出真实请求时,能看到 HTTP 200 与非零 usage,且五个签名头与 ma-relay 逐字节相同"
    owner: "relay-operator"

  - id: "G2"
    statement: "我们的 2api 只是保证转换的时候不破坏缓存"
    observable: "运维在同一会话连续 3 次请求后,能看到第 2、3 次的 cache_read_input_tokens 大于 0 且命中率高于 90%"
    owner: "relay-operator"

  - id: "G3"
    statement: "多个客户的请求打入同一个号,在上游看来是同一台设备的正常请求"
    observable: "运维在抽查同一账号的多次出站请求时,能看到 DeviceSeed、SessionID、客户端版本三者跨请求完全一致,且 JA3 指纹等于 Mirasim.app 的值"
    owner: "relay-operator"

  - id: "G4"
    statement: "额度调度策略,四层窗口"
    observable: "运维在某账号 7d_claude 耗尽时,能看到 opus 请求不再路由到该账号,而 fable 请求仍然可以"
    owner: "relay-operator"

  - id: "G5"
    statement: "mirasim 的状态码是真的可被 sub2 调度的"
    observable: "运维在上游返回 503/429/403 后,能看到账号状态按各自语义变化,且变化范围不超出该状态码应有的影响面"
    owner: "relay-operator"

  - id: "G6"
    statement: "mirasim 如何导入到 sub2,这也是一个难题"
    observable: "运维在导入 165 个账号后,能看到每一个账号的签名差分测试通过,数量与来源一致"
    owner: "relay-operator"

  - id: "G7"
    statement: "更好的售卖方式是去卖 token"
    observable: "运维在对账时,能看到系统记账金额与按 usage 手算的金额一致,差额为零"
    owner: "relay-operator"

  - id: "G8"
    statement: "部署出去之后出口要真的走代理,而且不能落回国内"
    observable: "运维在抽查全部 143 个账号的出口 IP 时,能看到没有一个落在中国大陆或香港,也没有一个等于 VPS 自身公网 IP"
    owner: "relay-operator"

  - id: "G9"
    statement: "sub2api 是开源白盒,用仓库默认的 secret 等于没有 secret"
    observable: "运维在部署后逐项核对时,能看到 JWT / 管理员口令 / DB 口令 / resin token 四个值没有一个等于仓库里的默认值"
    owner: "relay-operator"

  - id: "G10"
    statement: "卖出去的号必须是我愿意卖的那批,自用的号一个都不能混进去"
    observable: "运维在导入结束时,能看到导入数与保留数之和等于来源总数,且被点名保留的账号一个都没有进库"
    owner: "relay-operator"

  - id: "G11"
    statement: "验收要用真客户端跑通,不是 curl 手拼一个 body 就算数"
    observable: "运维在用真实 Claude Code 指向 sub2 的 URL 发起会话时,能看到返回真实 content 且 usage 的 input 与 output token 都不为零"
    owner: "relay-operator"

  - id: "G12"
    statement: "只放真 Claude Code 进来,伪造的要挡住"
    observable: "运维在用真实 Claude Code 2.1.272 请求时能看到通过,在用伪造客户端请求时能看到被拒绝"
    owner: "relay-operator"

  - id: "G13"
    statement: "每个号的真实档位要查得到,不能被它自己声称的值糊弄"
    observable: "运维在探测结束后,能看到声称档位与权威档位不一致的账号被显式标记出来,而不是被静默覆盖成其中一个"
    owner: "relay-operator"

criteria:

  # ── G1 签名 ──
  - id: "C1"
    goal: "G1"
    statement: "mirasim 签名实现与 ma-relay 在相同输入下产出逐字节相同的五个头,且对 body 敏感"
    oracle: "exact"
    quadrant: "Q1"
    check: "backend/internal/pkg/mirasim/ccore/sign_parity_test.go"
    negative: "body 改 1 bit 而签名不变,即判不通过(说明签的是常量而非 body)"
    role: "regression"
    release_behavior: "block"
    risk: "high"
    covers: ["SG:bytewise-parity", "SG:body-sensitivity"]

  - id: "C2"
    goal: "G1"
    statement: "签名覆盖 path 但不覆盖 query,且签名之后到发出为止无任何改写"
    oracle: "exact"
    quadrant: "Q1"
    check: "backend/internal/repository/mirasim_upstream_test.go"
    negative: "签名后 body sha256 或 header 快照发生变化,即判不通过;重试路径复用并改写已签请求同样不通过"
    role: "regression"
    release_behavior: "block"
    risk: "high"
    covers: ["SG:path-signed", "SG:query-not-signed", "SG:no-post-sign-mutation", "SG:retry-resigns", "SG:no-redirect"]

  - id: "C3"
    goal: "G1"
    statement: "真实 mirasim 账号能返回 200 与真实内容"
    oracle: "human_only"
    quadrant: "Q3"
    check: "human"
    record: "acceptance/records/live-request.md"
    negative: "返回 200 但 content 为空或 usage 全零,即判不通过(可能打到了错误的端点)"
    role: "regression"
    release_behavior: "block"
    risk: "high"

  # ── G2 缓存前缀 ──
  - id: "C4"
    goal: "G2"
    statement: "出站 body 的 tools 与 system 两段与入站逐字节相同"
    oracle: "exact"
    quadrant: "Q1"
    check: "backend/internal/service/mirasim_cache_prefix_test.go"
    negative: "system 被整体替换或被搬进 messages[0],即判不通过"
    role: "regression"
    release_behavior: "block"
    risk: "high"
    covers: ["CP:system-bytewise", "CP:tools-bytewise"]

  - id: "C5"
    goal: "G2"
    statement: "body 序列化不经 map round-trip:key 不重排、HTML 字符不转义、大整数不丢精度"
    oracle: "exact"
    quadrant: "Q1"
    check: "backend/internal/service/mirasim_cache_prefix_test.go"
    negative: "出现 key 字母序重排、< 被转义成 \\u003c、或大整数尾部变零,任一即判不通过"
    role: "regression"
    release_behavior: "block"
    risk: "high"
    covers: ["CP:no-key-reorder", "CP:no-html-escape", "CP:bigint-precision"]

  - id: "C6"
    goal: "G2"
    statement: "跨轮出站前缀单调:第 2 轮是第 1 轮的字节前缀(bytes.HasPrefix 是精确判据,不是关系近似)"
    oracle: "exact"
    quadrant: "Q1"
    check: "backend/internal/service/mirasim_cache_prefix_test.go"
    negative: "第 2 轮出站前缀与第 1 轮出现任何非追加式差异,即判不通过"
    role: "regression"
    release_behavior: "block"
    risk: "high"
    covers: ["CP:prefix-monotonic"]

  - id: "C7"
    goal: "G2"
    statement: "生产流量上的实际缓存命中率不低于 ma-relay 基准"
    oracle: "human_only"
    quadrant: "Q3"
    check: "human"
    record: "acceptance/records/cache-hit-rate.md"
    negative: "命中率低于基准的 90%(即低于 86%),即判不通过"
    role: "capability"
    release_behavior: "track"
    risk: "high"

  # ── G3 身份 ──
  - id: "C8"
    goal: "G3"
    statement: "设备身份跨重启、跨客户端、跨 Redis 清空保持不变,且账号间互不相同"
    oracle: "exact"
    quadrant: "Q1"
    check: "backend/internal/service/mirasim_identity_test.go"
    negative: "清空 Redis 后 DeviceSeed 或 SessionID 发生变化,即判不通过;不同账号的 SessionID 相同同样不通过"
    role: "regression"
    release_behavior: "block"
    risk: "high"
    covers: ["ID:deviceseed-stable", "ID:deviceseed-db-backed", "ID:sessionid-stable", "ID:sessionid-distinct"]

  - id: "C9"
    goal: "G3"
    statement: "出站客户端版本与入站无关且自洽,mirasim app 版本与签名方案配对"
    oracle: "exact"
    quadrant: "Q1"
    check: "backend/internal/service/mirasim_identity_test.go"
    negative: "两个不同版本的客户端打到同一账号却产生不同的出站版本,即判不通过"
    role: "regression"
    release_behavior: "block"
    risk: "medium"
    covers: ["ID:version-client-independent", "ID:version-coherent", "ID:mirasim-client-paired"]

  - id: "C10"
    goal: "G3"
    statement: "TLS ClientHello 的 JA3 等于 Mirasim.app 的值"
    oracle: "exact"
    quadrant: "Q4"
    check: "backend/internal/pkg/tlsfingerprint/mirasim_profile_test.go"
    negative: "JA3 等于 sub2api 现成的 Claude Code profile(44f88fca...),即判不通过"
    role: "regression"
    release_behavior: "block"
    risk: "high"
    covers: ["ID:tls-ja3"]

  # ── G4 配额 ──
  - id: "C11"
    goal: "G4"
    statement: "可调度性是多窗口 AND,且族级窗口互不牵连"
    oracle: "exact"
    quadrant: "Q1"
    check: "backend/internal/service/mirasim_quota_test.go"
    negative: "7d_claude 耗尽后 fable 请求也被判不可调度,即判不通过(过度牵连)"
    role: "regression"
    release_behavior: "block"
    risk: "high"
    covers: ["QU:opus-window-and", "QU:fable-window-and", "QU:family-isolation", "QU:single-quota-state"]

  - id: "C12"
    goal: "G4"
    statement: "运营者能在后台看懂某账号为何不可调度"
    oracle: "human_only"
    quadrant: "Q3"
    check: "human"
    record: "acceptance/records/quota-visibility.md"
    negative: "运维看不出是哪个窗口耗尽导致停调,即判不通过"
    role: "regression"
    release_behavior: "track"
    risk: "medium"

  # ── G5 状态码 ──
  - id: "C13"
    goal: "G5"
    statement: "上游各状态码产生各自语义对应的账号状态变化,影响面不超出应有范围"
    oracle: "exact"
    quadrant: "Q2"
    check: "backend/internal/service/mirasim_statuscode_test.go"
    negative: "503 导致账号被冷却或禁用,即判不通过(该码语义是账号健康、模型无容量)"
    role: "regression"
    release_behavior: "block"
    risk: "high"
    covers: ["SC:503-capacity", "SC:429-5h", "SC:429-7d", "SC:429-7d-claude", "SC:429-7d-fable", "SC:403-banned"]

  - id: "C14"
    goal: "G5"
    statement: "客户端侧错误不放大:400 不连坐、401 触发刷新、402 本地拦截、499 不换号重试"
    oracle: "exact"
    quadrant: "Q2"
    check: "backend/internal/service/mirasim_statuscode_test.go"
    negative: "因 header 导致的 400 污染了仅 body 相同的后续请求,即判不通过;499 后重试到另一账号同样不通过"
    role: "regression"
    release_behavior: "block"
    risk: "high"
    covers: ["SC:400-badrequest", "SC:401-expired", "SC:402-nobalance", "SC:499-cancel"]

  - id: "C15"
    goal: "G5"
    statement: "现有渠道的状态码行为未被改变(判据是既有测试全绿 + 冷却时长逐值比对,非模型评分)"
    oracle: "exact"
    quadrant: "Q2"
    check: "backend/internal/service/mirasim_statuscode_test.go"
    negative: "任一既有渠道的冷却时长或禁用条件发生变化,即判不通过"
    role: "regression"
    release_behavior: "block"
    risk: "high"
    covers: ["RG:existing-channels-unchanged"]

  - id: "C20"
    goal: "G5"
    statement: "运营者确认状态码引起的账号状态变化与 mirasim 的真实语义一致"
    oracle: "human_only"
    quadrant: "Q3"
    check: "human"
    record: "acceptance/records/statuscode-semantics.md"
    negative: "某个状态码的处理在代码里正确、但与 mirasim 上游的实际语义不符,即判不通过(机器只能验代码实现了声明的语义,验不了声明本身对不对)"
    role: "regression"
    release_behavior: "block"
    risk: "high"

  # ── G6 迁移 ──
  - id: "C16"
    goal: "G6"
    statement: "导入器逐账号校验签名,且重复执行幂等"
    oracle: "exact"
    quadrant: "Q2"
    check: "backend/internal/handler/admin/account_mirasim_import_test.go"
    negative: "任一账号导入后签名差分不通过却仍报告导入成功,即判不通过"
    role: "regression"
    release_behavior: "block"
    risk: "high"
    covers: ["MG:per-account-signature", "MG:idempotent", "MG:source-preserved"]

  - id: "C17"
    goal: "G6"
    statement: "运营者能确认迁移后的账号数量与来源一致"
    oracle: "human_only"
    quadrant: "Q3"
    check: "human"
    record: "acceptance/records/migration-signoff.md"
    negative: "导入报告的 created 数与来源账号数不符却未被察觉,即判不通过"
    role: "regression"
    release_behavior: "block"
    risk: "high"

  # ── G7 计费 ──
  - id: "C18"
    goal: "G7"
    statement: "cache 折扣与模型定价按 Anthropic 口径计算"
    oracle: "exact"
    quadrant: "Q2"
    check: "backend/internal/service/mirasim_billing_test.go"
    negative: "cache_read 按 1x 或更高计价(折扣方向算反),即判不通过"
    role: "regression"
    release_behavior: "block"
    risk: "high"
    covers: ["BL:cache-read-discount", "BL:cache-write-5m", "BL:cache-write-1h", "BL:no-price-fallback"]

  - id: "C19"
    goal: "G7"
    statement: "对账结果由人确认:系统记账与手算金额一致"
    oracle: "human_only"
    quadrant: "Q3"
    check: "human"
    record: "acceptance/records/billing-reconciliation.md"
    negative: "存在任何无法解释的差额,即判不通过"
    role: "regression"
    release_behavior: "block"
    risk: "high"

  # ── G4 续:配额窗口的证据等级 ──
  # 判据落在 mirasim_window_evidence_test.go:「认识的 token 写对 scope」与
  # 「不认识的 token 必须吵」是两件事,后者才是真正花钱的那一件 ——
  # 静默丢弃会让「上游没限流」和「限流了但我们没认出来」在运维视角下完全同形。
  - id: "C21"
    goal: "G4"
    statement: "四个已知 window token 各自写到对应的 scope:5h/7d 落账号级标量,7d_claude/7d_fable 落各自 scope"
    oracle: "exact"
    quadrant: "Q2"
    check: "backend/internal/service/mirasim_window_evidence_test.go"
    negative: "某个 window token 被写到别的 scope,或本该落 scope 的家族窗口落到了账号级标量,即判不通过"
    role: "regression"
    release_behavior: "block"
    risk: "high"
    covers: ["QW:known-window-tokens-map"]

  - id: "C22"
    goal: "G4"
    statement: "未识别的 window token 留下可观测信号,不被静默丢弃"
    oracle: "exact"
    quadrant: "Q2"
