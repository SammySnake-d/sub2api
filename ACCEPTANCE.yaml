    oracle: "human_only"
    quadrant: "Q3"
    check: "human"
    record: "acceptance/records/egress-geo-and-proxy-effective.md"
    negative: "任一账号的出口 IP 归属为 CN 或 HK,或等于 VPS 自身公网 IP,即判不通过(第二种更危险:它长得像「代理配好了」但请求在裸奔)"
    role: "regression"
    release_behavior: "block"
    risk: "high"
    covers: ["DP:egress-not-cn-hk", "DP:egress-not-vps-itself"]

